services:
  db:
    image: mysql:8
    container_name: embark-db
    environment:
      MYSQL_ROOT_PASSWORD: embark123
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: embark
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: embark-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-embark-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-embark-minio-123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embark-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://root:embark123@db:3306/embark}
      APP_ID: ${APP_ID:-embark-dev}
      APP_SECRET: ${APP_SECRET:-dev-secret-replace-in-production}
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:-https://auth.kimi.com}
      VITE_APP_ID: ${VITE_APP_ID:-embark-dev}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL:-https://auth.kimi.com}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL:-https://open.kimi.com}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-dev-owner}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-embark-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-embark-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-embark-minio-123}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: embark-migrate
    command: sh -c "npx drizzle-kit push --force"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://root:embark123@db:3306/embark}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
